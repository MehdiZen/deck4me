[package]
name = "deck4me"
version = "0.2.0"
description = "deck4me — gesture overlay pour stream"
authors = []
edition = "2021"

[lib]
name = "deck4me_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
axum = { version = "0.8", features = ["ws"] }
sha1 = "0.10"
hex = "0.4"
rand = "0.8"
imagesize = "0.13"
# Encodeur JPEG pur Rust, sans dépendance C : sert à livrer les images de la
# caméra virtuelle directement à la webview, sans repasser par DirectShow.
jpeg-encoder = "0.6"
# Décodage des memes pour l'incrustation caméra (camoverlay). gif est inclus
# mais seule la première image est lue en phase 1 — aucune boucle d'animation.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
libloading = "0.8"
nokhwa = { version = "0.10", features = ["input-msmf"] }
winreg = "0.52"
tauri-plugin-global-shortcut = "2"
# Une seule instance à la fois. Sans lui, un second lancement se heurtait au port
# local déjà pris et restait planté sur ce message, sans rien pouvoir faire.
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
libloading = "0.8"
reqwest = { version = "0.12", default-features = false }
tokio-tungstenite = "0.24"
futures-util = "0.3"
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
